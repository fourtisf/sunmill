<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" color="#5C3618" role="img" aria-label="SUNMILL">
  <title>SUNMILL</title>
  <!-- Lockup: the mark carries the colour, so only the wordmark follows
       `color`. The wordmark is drawn as stroked skeletons rather than set in a
       typeface, so the logo renders identically with no font to load or
       licence. Grid: cap height 100, stroke 27, round caps and joins.
       Use the -light cut on dark grounds. -->
  <defs>
    <radialGradient id="logo-sun" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="52%" stop-color="#F6C94F"/>
      <stop offset="100%" stop-color="#DDA426"/>
    </radialGradient>
    <clipPath id="logo-disc"><circle cx="256" cy="258" r="152"/></clipPath>
  </defs>
  <g transform="translate(86,40) scale(0.46875)">
    <rect x="12" y="12" width="488" height="488" rx="112" fill="#2C1705"/>
    <circle cx="256" cy="258" r="152" fill="url(#logo-sun)"/>
    <g clip-path="url(#logo-disc)" fill="#2C1705">
      <rect x="60" y="384" width="392" height="92"/>
      <path d="M198 396 L224 274 H288 L314 396 Z"/>
      <path d="M214 278 Q256 222 298 278 Z"/>
      <path d="M141 133 L371 363 M371 133 L141 363" stroke="#2C1705" stroke-width="31" fill="none"/>
      <circle cx="256" cy="248" r="23"/>
    </g>
    <rect x="26" y="26" width="460" height="460" rx="100" fill="none"
          stroke="#F6C94F" stroke-width="4" opacity=".15"/>
  </g>
  <g transform="translate(389,105) scale(1.1)">
    <g fill="none" stroke="currentColor" stroke-width="27" stroke-linecap="round" stroke-linejoin="round">
      <path d="M68 28 C58 12 20 14 20 34 C20 52 68 50 68 68 C68 88 30 90 20 74"/>
      <path d="M118 14 V58 a27 27 0 0 0 54 0 V14"/>
      <path d="M220 86 V14 L274 86 V14"/>
      <path d="M322 86 V14 L362 52 L402 14 V86"/>
      <path d="M450 14 V86"/>
      <path d="M498 14 V86 H548"/>
      <path d="M596 14 V86 H646"/>
    </g>
  </g>
</svg>
