<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SUNMILL">
  <title>SUNMILL</title>
  <!-- Solar Mill. The sails are not drawn on top of the sun, they are cut out
       of it: everything below is clipped to the disc, so the sail tips and the
       ground end flush with its edge and the two shapes read as one struck
       form rather than a sticker on a coin. -->
  <defs>
    <radialGradient id="sm-sun" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="52%" stop-color="#F6C94F"/>
      <stop offset="100%" stop-color="#DDA426"/>
    </radialGradient>
    <clipPath id="sm-disc"><circle cx="256" cy="258" r="152"/></clipPath>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="112" fill="#2C1705"/>
  <circle cx="256" cy="258" r="152" fill="url(#sm-sun)"/>

  <g clip-path="url(#sm-disc)" fill="#2C1705">
    <rect x="60" y="384" width="392" height="92"/>
    <path d="M198 396 L224 274 H288 L314 396 Z"/>
    <path d="M214 278 Q256 222 298 278 Z"/>
    <path d="M141 133 L371 363 M371 133 L141 363" stroke="#2C1705" stroke-width="31" fill="none"/>
    <circle cx="256" cy="248" r="23"/>
  </g>

  <!-- The tile is nearly black; without this hairline the icon loses its edge
       against a dark page. It is definition, not decoration. -->
  <rect x="26" y="26" width="460" height="460" rx="100" fill="none"
        stroke="#F6C94F" stroke-width="4" opacity=".15"/>
</svg>
