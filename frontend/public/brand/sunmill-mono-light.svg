<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" color="#FFF4D4" role="img" aria-label="SUNMILL">
  <title>SUNMILL</title>
  <!-- One colour, for stamps, embossing, and anywhere the gold cannot go.
       The filled disc has to become a ring here: with no second colour, a solid
       sun would swallow the mill standing on it. Set `color` to recolour. -->
  <g fill="currentColor">
    <circle cx="256" cy="256" r="186" fill="none" stroke="currentColor" stroke-width="26"/>
    <g transform="translate(0 12) translate(256 256) scale(0.72) translate(-256 -256)">
      <path d="M206 368 L228 256 H284 L306 368 Z"/>
      <path d="M220 260 Q256 204 292 260 Z"/>
      <path d="M180 162 L332 310 M332 162 L180 310" stroke="currentColor"
            stroke-width="30" stroke-linecap="round" fill="none"/>
      <circle cx="256" cy="236" r="21"/>
    </g>
  </g>
</svg>
